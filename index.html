<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="24/7">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>24/7</title>
<style>
  /* Nachbau des iOS-Mail-Posteingangs (Davids Screenshot 30.09.2026, iPhone 393 pt breit), Maße in pt = CSS-px.
     Grundlinien aus dem Screenshot gemessen; bei SF Pro und line-height 1 liegt die Grundlinie bei Zeilenhöhe L
     (L − 1,193 × Größe) / 2 + 0,952 × Größe unter der Oberkante des Textkastens. */
  :root{ --label:#000000; --grau:#8A8A8E; --linie:#C6C6C8; --pfeil:#C4C4C7; --blau:#007AFF; }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#FFFFFF;}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color:var(--label);-webkit-font-smoothing:antialiased;}
  main{max-width:600px;margin:0 auto;padding-top:env(safe-area-inset-top);}
  header{position:relative;height:76px;margin:0 16px;border-bottom:.33px solid var(--linie);}
  h1{position:absolute;left:0;top:10.9px;font:700 34px/34px -apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;letter-spacing:.37px;}
  #stand{position:absolute;left:0;top:48.9px;font:400 15px/15px -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color:var(--grau);white-space:nowrap;}
  .runde{position:relative;height:100.8px;}
  .runde::after{content:"";position:absolute;left:34.7px;right:16px;bottom:0;border-bottom:.33px solid var(--linie);}
  .punkt{position:absolute;left:16.35px;top:18px;width:8.7px;height:8.7px;border-radius:50%;background:var(--blau);}
  .wer{position:absolute;left:34.7px;right:120px;top:11.26px;font:600 17px/22px -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .zeit{position:absolute;right:32.3px;top:15.5px;font:400 15px/15px -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color:var(--grau);}
  .pfeil{position:absolute;right:16.2px;top:15.9px;width:8px;height:13px;}
  .betreff{position:absolute;left:34.7px;right:16px;top:31.4px;font:400 15px/20px -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .satz{position:absolute;left:34.7px;right:16px;top:50.3px;font:400 15px/19.33px -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color:var(--grau);
        display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
</style>
</head>
<body>
<main>
  <header><h1>24/7</h1><div id="stand">Porchnap · Loading</div></header>
  <div id="liste"></div>
</main>
<script>
// Rundenarten heißen wie die Tische im Büro (mb22.../buero), alles Englische ist Rahmen, die Sätze bleiben deutsch.
const WER = { normal:"Operations Lead", recherche:"Head of Research", kreativ:"Creative Director",
              verbesserer:"Chief of Staff", lr:"Market Intelligence", gross:"Creative Director" };
const API = "https://api.github.com/repos/davidlichters/takt/contents/zeilen.json?ref=daten";
const ROH = "https://raw.githubusercontent.com/davidlichters/takt/daten/zeilen.json";
const PFEIL = '<svg class="pfeil" viewBox="0 0 8 13" aria-hidden="true"><path d="M1.5 1.5 6.5 6.5 1.5 11.5" fill="none" stroke="#C4C4C7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
async function holen(){
  if (window.DATEN_TEST) return window.DATEN_TEST;
  try { const r = await fetch(API, {cache:"no-cache", headers:{Accept:"application/vnd.github.raw+json"}}); if (r.ok) return await r.json(); } catch(e) {}
  const r = await fetch(ROH + "?t=" + Date.now(), {cache:"no-store"}); return await r.json();
}
function iso(d){ return new Date(d.getTime() - d.getTimezoneOffset()*6e4).toISOString().slice(0,10); }
function wann(e){
  const heute = window.HEUTE_TEST || iso(new Date());
  const gestern = iso(new Date(new Date(heute + "T12:00:00").getTime() - 864e5));
  if (e.tag === heute) return e.zeit;
  if (e.tag === gestern) return "Yesterday";
  const [j,m,t] = e.tag.split("-"); return `${t}.${m}.${j.slice(2)}`;
}
function el(tag, cls, text){ const x = document.createElement(tag); x.className = cls; if (text !== undefined) x.textContent = text; return x; }
async function laden(){
  try{
    const daten = (await holen()).slice().reverse();
    const liste = document.getElementById("liste"); liste.innerHTML = "";
    for (const e of daten){
      const z = el("div", "runde");
      z.append(el("div", "punkt"), el("div", "wer", WER[e.typ] || "Operations Lead"), el("div", "zeit", wann(e)));
      z.insertAdjacentHTML("beforeend", PFEIL);
      z.append(el("div", "betreff", e.titel || e.satz), el("div", "satz", e.titel ? e.satz : ""));
      liste.appendChild(z);
    }
    document.getElementById("stand").textContent = daten.length ? `Porchnap · Last ${daten[0].zeit}` : "Porchnap · No rounds yet";
  }catch(f){ document.getElementById("stand").textContent = "Porchnap · Offline, retrying"; }
}
laden(); if (!window.DATEN_TEST) setInterval(laden, 60000);
</script>
</body>
</html>
