<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Doom Scroll">
<title>Doom Scroll</title>
<style>
  /* Nachbau der iOS-Speicheransicht "iCloud Photos" (Davids Screenshot 30.09.2026, iPhone 393 x 852 pt), Maße in pt = CSS-px,
     aus dem 1179-px-Bild gemessen (÷ 3). Grundlinie bei SF Pro und line-height = Größe: 0,8555 × Größe unter der Oberkante. */
  :root{ --grau:#8B8B8B; --spur:#26252A; --gruen:#407950; --rot:#FF453A; --orange:#FF9F0A; --gelb:#FFD60A; }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#000;color:#fff;}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  main{position:relative;width:393px;height:100vh;height:100dvh;margin:0 auto;}
  /* Symbol immer auf halber Bildschirmhöhe (David 30.09. 14:05); alles darunter mit den Abständen aus dem Screenshot */
  #gruppe{position:absolute;left:0;width:393px;top:calc(50% - 51px);}
  #symbol{position:absolute;left:145.67px;top:0;width:102px;height:102px;border-radius:22.6px;background:var(--spur);overflow:hidden;}
  #symbol img{width:100%;height:100%;display:block;}
  #wer{position:absolute;left:16.07px;top:160.73px;font:400 17px/17px -apple-system,"SF Pro Text",system-ui;white-space:nowrap;}
  #mehr{position:absolute;right:16.37px;top:160.73px;font:400 17px/17px -apple-system,"SF Pro Text",system-ui;color:var(--grau);white-space:nowrap;}
  #balken{position:absolute;left:16px;top:184.78px;width:360.67px;height:10px;border-radius:5px;background:var(--spur);overflow:hidden;}
  #balken i{position:absolute;top:0;height:10px;}
  #legende{position:absolute;left:16px;right:16px;top:204.33px;display:flex;flex-wrap:wrap;gap:6px 14px;}
  .eintrag{display:flex;align-items:center;height:10px;font:400 11px/11px -apple-system,"SF Pro Text",system-ui;white-space:nowrap;}
  .eintrag b{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:3.07px;}
  .eintrag span{position:relative;top:-1px;}
</style>
</head>
<body>
<main><div id="gruppe">
  <div id="symbol"></div>
  <div id="wer">Timo</div>
  <div id="mehr"></div>
  <div id="balken"></div>
  <div id="legende"></div>
</div></main>
<script>
  // Daten: Zweig "daten", Datei handy.json, geschrieben von ~/handy/waechter.mjs auf dem MacBook (David 30.09.2026).
  const QUELLE_API = "https://api.github.com/repos/davidlichters/takt/contents/handy.json?ref=daten";
  const QUELLE_RAW = "https://raw.githubusercontent.com/davidlichters/takt/daten/handy.json";
  const ARTEN = [
    { name: "TikTok",    farbe: "var(--rot)",    muster: /tiktok/i,    bild: "tiktok.png",    zeitfresser: true },
    { name: "Instagram", farbe: "var(--rot)",    muster: /instagram/i, bild: "instagram.png", zeitfresser: true },
    { name: "YouTube",   farbe: "var(--gelb)",   muster: /youtube/i,   bild: "youtube.png",   zeitfresser: true },
    { name: "Claude",    farbe: "var(--gruen)",  muster: /claude/i,    bild: "claude.png",    zeitfresser: false },
  ];
  // Andere Apps zählen nicht: sie bleiben grau wie die leere Spur (David 30.09. 14:00: "nur grau, rot und grün")
  const ANDERE = null;
  const art = app => ARTEN.find(a => a.muster.test(app || "")) || null;
  const WER = "Timo";
  let etag = null, daten = window.DATEN_TEST || null;

  // Mitternacht Berlin als Zeitstempel, damit der Balken immer 00:00 bis 24:00 deutscher Zeit zeigt
  function tagesanfang(jetzt) {
    const f = new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Berlin", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
    const t = Object.fromEntries(f.formatToParts(jetzt).map(p => [p.type, p.value]));
    const seitMitternacht = ((+t.hour % 24) * 3600 + +t.minute * 60 + +t.second) * 1000 + jetzt % 1000;
    return jetzt - seitMitternacht;
  }
  const dauer = ms => { const m = Math.round(ms / 60000); return m < 60 ? `${m} min` : `${Math.floor(m / 60)} hr ${m % 60} min`; };

  function zeichnen() {
    const jetzt = window.JETZT_TEST || Date.now(), t0 = tagesanfang(jetzt), t1 = t0 + 864e5;
    const p = (daten && daten.personen && daten.personen[WER]) || { sitzungen: [], offen: null };
    const sitz = [...(p.sitzungen || [])];
    if (p.offen) sitz.push({ app: p.offen.app, start: p.offen.seit, ende: new Date(jetzt).toISOString() });
    const balken = document.getElementById("balken"); balken.innerHTML = "";
    const summe = new Map();
    for (const s of sitz) {
      const a = Math.max(t0, Date.parse(s.start)), b = Math.min(t1, Math.min(jetzt, Date.parse(s.ende)));
      if (!(b > a)) continue;
      const k = art(s.app); if (!k) continue; summe.set(k, (summe.get(k) || 0) + (b - a));
      const i = document.createElement("i");
      i.style.left = ((a - t0) / 864e5 * 100) + "%";
      i.style.width = `max(1px, calc(${(b - a) / 864e5 * 100}% - 0.67px))`;
      i.style.background = k.farbe;
      balken.appendChild(i);
    }
    const fresser = [...summe].filter(([k]) => k.zeitfresser).reduce((x, [, v]) => x + v, 0);
    document.getElementById("mehr").textContent = `${(fresser / 36e5).toFixed(1)} hrs more than David`;   // David: 0 Stunden
    const leg = document.getElementById("legende"); leg.innerHTML = "";
    for (const k of ARTEN) {
      const v = summe.get(k); if (!v || v < 30000) continue;
      const e = document.createElement("div"); e.className = "eintrag";
      e.innerHTML = `<b style="background:${k.farbe}"></b><span>${k.name} ${dauer(v)}</span>`;
      leg.appendChild(e);
    }
    // Symbol: die App, die gerade offen ist; sonst die zuletzt benutzte der vier (vorher blieb die Kachel leer, David 14:00)
    const zuletzt = [...sitz].filter(s => art(s.app)).sort((x, y) => Date.parse(y.ende) - Date.parse(x.ende))[0];
    const jetztArt = (p.offen && art(p.offen.app)) || (zuletzt && art(zuletzt.app)) || null;
    document.getElementById("symbol").innerHTML = jetztArt && jetztArt.bild ? `<img src="${jetztArt.bild}" alt="${jetztArt.name}">` : "";
  }

  async function laden() {
    if (window.DATEN_TEST) return zeichnen();
    try {
      const r = await fetch(QUELLE_API, { headers: Object.assign({ Accept: "application/vnd.github.raw+json" }, etag ? { "If-None-Match": etag } : {}), cache: "no-store" });
      if (r.status === 304) return zeichnen();
      if (!r.ok) throw new Error(r.status);
      etag = r.headers.get("ETag"); daten = await r.json();
    } catch (f) {
      try { daten = await (await fetch(QUELLE_RAW + "?t=" + Date.now(), { cache: "no-store" })).json(); } catch (g) {}
    }
    zeichnen();
  }
  laden(); setInterval(laden, 30000);
</script>
</body>
</html>
